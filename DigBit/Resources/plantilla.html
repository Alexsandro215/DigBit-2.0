<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Bitacora DigBit</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 10pt;
            color: #000;
        }

        .page-table {
            width: 100%;
            border-collapse: collapse;
        }

        .title-block {
            text-align: center;
            font-size: 10.5pt;
            line-height: 1.15;
        }

        .title-block div {
            margin: 0;
            padding: 0;
        }

        .section-spacer {
            height: 22px;
        }

        .info-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .label-cell {
            text-align: right;
            vertical-align: middle;
            font-weight: bold;
            padding: 8px 6px 8px 0;
            white-space: nowrap;
        }

        .value-cell {
            border-bottom: 1px solid black;
            text-align: center;
            vertical-align: middle;
            padding: 8px 6px;
            word-wrap: break-word;
        }

        .value-cell.multi-line {
            line-height: 1.15;
        }

        .header-logo-space {
            width: 20%;
        }
    </style>
</head>
<body>
    <table class="page-table">
        <tr>
            <td class="header-logo-space"></td>
            <td class="title-block" style="width:60%">
                <div>TECNOLOGICO DE ESTUDIOS SUPERIORES DE CHIMALHUACAN</div>
                <div>ORGANISMO PUBLICO DESCENTRALIZADO DEL ESTADO DE MEXICO</div>
                <div>DIVISION ACADEMICA DE SISTEMAS COMPUTACIONALES</div>
            </td>
            <td class="header-logo-space"></td>
        </tr>
        <tr><td colspan="3" class="section-spacer"></td></tr>

        <tr>
            <td colspan="3">
                <table class="info-table">
                    <tr>
                        <td class="label-cell" style="width:18%">HORARIO DE ENTRADA:</td>
                        <td class="value-cell" style="width:15%">@HORARIODEENTRADA</td>
                        <td class="label-cell" style="width:18%">HORARIO DE SALIDA:</td>
                        <td class="value-cell" style="width:15%">@HORARIODESALIDA</td>
                        <td class="label-cell" style="width:12%">FECHA:</td>
                        <td class="value-cell" style="width:22%">@FECHA</td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr><td colspan="3" class="section-spacer"></td></tr>
        <tr>
            <td colspan="3">
                <table class="info-table">
                    <tr>
                        <td class="label-cell" style="width:12%">PROFESOR:</td>
                        <td class="value-cell multi-line" style="width:32%">@PROFESOR</td>
                        <td class="label-cell" style="width:11%">MATERIA:</td>
                        <td class="value-cell multi-line" style="width:29%">@MATERIA</td>
                        <td class="label-cell" style="width:8%">GRUPO:</td>
                        <td class="value-cell" style="width:8%">@GRUPO</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
